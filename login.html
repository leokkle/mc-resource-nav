<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>登录 · 方块导航</title>
<style>
:root{
  --bg:#141519; --panel:#1c1e24; --panel-2:#22252c; --line:#31353f;
  --text:#e8eaef; --text-dim:#9aa1b0; --c-mod:#4f9d69; --ink-mod:#7fd39a;
  --font-ui:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
html[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --line:#dfe3ea;
  --text:#1b1f27; --text-dim:#5f6875; --c-mod:#2f7d4f; --ink-mod:#1f5e38;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:15px; line-height:1.6;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.card{
  width:100%; max-width:392px; padding:26px 24px 22px;
  border:1px solid var(--line); border-radius:16px; background:var(--panel);
  box-shadow:0 18px 48px rgba(0,0,0,.22);
}
.brand{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:800; color:var(--text-dim); margin-bottom:14px}
.logo{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;color:var(--ink-mod);background:var(--panel-2)}
h1{font-size:20px;line-height:1.3;margin:0}
.sub{margin:7px 0 0;font-size:13px;line-height:1.65;color:var(--text-dim)}
label{display:block;margin:18px 0 6px;font-size:12.5px;font-weight:800;color:var(--text-dim)}
.pw{position:relative;display:flex;align-items:center}
input[type=password],input[type=text]{
  width:100%; padding:11px 60px 11px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel-2); color:var(--text); font-size:14px; font-family:var(--font-mono);
}
input::placeholder{font-family:var(--font-ui);color:var(--text-dim)}
input:focus{outline:2px solid var(--c-mod);outline-offset:1px;border-color:var(--c-mod)}
.eye{position:absolute;right:6px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--text-dim);font-size:12px;font-weight:700;cursor:pointer}
.eye:hover{color:var(--text);border-color:var(--text-dim)}
.msg{min-height:20px;margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--text-dim)}
.msg.bad{color:#e2725f}
button.submit{
  width:100%; margin-top:6px; padding:11px 14px; border:1px solid var(--c-mod); border-radius:10px;
  background:transparent; color:var(--ink-mod); font-size:14px; font-weight:800; cursor:pointer;
  font-family:var(--font-ui);
}
button.submit:hover{background:rgba(127,127,127,.12)}
button.submit[disabled]{opacity:.55;cursor:not-allowed}
.foot{margin-top:14px;font-size:11.5px;line-height:1.6;color:var(--text-dim);text-align:center}
.shake .card{animation:sk .32s ease}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off" novalidate>
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8 20.6 7.6v8.8L12 21.2 3.4 16.4V7.6z"/><path d="M3.4 7.6 12 12.4l8.6-4.8M12 12.4v8.8"/></svg></span>
    方块导航
  </div>
  <h1>输入访问令牌</h1>
  <p class="sub">本站已启用边缘鉴权，令牌由服务端校验，未登录无法获取任何页面内容。</p>
  <label for="t">令牌</label>
  <div class="pw">
    <input id="t" type="password" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    <button class="eye" id="eye" type="button">显示</button>
  </div>
  <p class="msg" id="m" role="status" aria-live="polite">区分大小写，含符号请照抄。</p>
  <button class="submit" id="s" type="submit">进入</button>
  <p class="foot">令牌由站长发放，请勿转借他人。</p>
</form>
<script>
(function(){
  var f=document.getElementById('f'), t=document.getElementById('t'), m=document.getElementById('m'),
      s=document.getElementById('s'), eye=document.getElementById('eye');
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (next.indexOf('//') === 0 || next.charAt(0) !== '/') next = '/';
  var busy=false;

  eye.addEventListener('click', function(){
    var show = t.type === 'password';
    t.type = show ? 'text' : 'password';
    eye.textContent = show ? '隐藏' : '显示';
    t.focus();
  });

  function fail(text){
    m.textContent = text; m.className = 'msg bad';
    document.body.classList.remove('shake'); void document.body.offsetWidth;
    document.body.classList.add('shake');
    t.select();
  }

  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (busy) return;
    var token = (t.value || '').trim();
    if (!token) { fail('请先输入令牌。'); return; }
    busy = true; s.disabled = true; s.textContent = '验证中…';
    fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token: token}),
      credentials: 'same-origin'
    }).then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(res){
        if (res.data && res.data.ok) {
          m.className = 'msg'; m.textContent = '验证通过，正在进入…';
          location.replace(next);
          return;
        }
        busy = false; s.disabled = false; s.textContent = '进入';
        if (res.data && res.data.error === 'locked') {
          fail('尝试次数过多，请 ' + (res.data.retryAfter || 60) + ' 秒后再试。');
        } else if (res.data && res.data.error === 'invalid') {
          fail('令牌无效，请核对后再试' + (typeof res.data.left === 'number' ? '（剩余 ' + res.data.left + ' 次）' : '') + '。');
        } else {
          fail('服务异常，请稍后再试。');
        }
      })
      .catch(function(){
        busy = false; s.disabled = false; s.textContent = '进入';
        fail('网络错误，请检查连接后重试。');
      });
  });

  t.focus();
})();
</script>
</body>
</html>
